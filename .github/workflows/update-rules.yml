name: Update Rules
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
permissions:
  contents: write
concurrency:
  group: update-rules-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Convert
        run: python convert.py
      - name: Validate generated output
        run: python convert.py --validate-only
      - name: Real Xray resource loading
        run: |
          python scripts/fetch_xray.py
          python scripts/smoke_xray.py --xray .work/xray/xray --geoip .work/xray/geoip.dat
      - name: Check reproducibility
        run: python scripts/check_determinism.py
      - name: Commit changed output
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- output/v2rayn output/v2rayng output/debug output/stats.json output/README.md
          if git diff --cached --quiet; then
            echo 'No output changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update proxy rules'
          git push origin "HEAD:$TARGET_BRANCH"
